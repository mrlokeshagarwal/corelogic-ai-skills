name: Validate skills
on: [push, pull_request]
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate library and discover Python tests
        run: |
          python tools/validate_library.py
          python -m unittest discover -s skills/dotnet-upgrade/tests -p 'test_*.py' -v
          python -m unittest discover -s tools -p 'test_*.py' -v
      - run: python tools/package_skill.py --all
      - name: Build and verify complete release ZIP
        run: python tools/package_repo.py
      - run: python tools/smoke_install_paths.py

  start-story-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ensure start-story scripts are present
        shell: pwsh
        run: |
          $required = @(
            'skills/start-story/scripts/common.ps1',
            'skills/start-story/scripts/create-branch.ps1',
            'skills/start-story/scripts/create-pr.ps1',
            'skills/start-story/scripts/detect-repo.ps1',
            'skills/start-story/scripts/fetch-work-item.ps1',
            'skills/start-story/scripts/status-summary.ps1',
            'skills/start-story/scripts/validate.ps1'
          )
          $missing = @($required | Where-Object { -not (Test-Path -LiteralPath $_) })
          if ($missing.Count -gt 0) {
            Write-Host 'Checked-out start-story tree:'
            Get-ChildItem skills/start-story -Recurse | Select-Object FullName
            throw "Missing start-story scripts (often caused by a bare Scripts/ gitignore rule on Windows):`n$($missing -join "`n")"
          }
          Get-ChildItem skills/start-story/scripts | Format-Table Name, Length
      - name: Parse start-story PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem skills/start-story -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors) {
              $failed = $true
              Write-Host "::error file=$($_.FullName)::$($errors[0].Message)"
            }
          }
          if ($failed) { exit 1 }
      - name: Run start-story tests
        shell: pwsh
        run: ./skills/start-story/tests/run-tests.ps1
